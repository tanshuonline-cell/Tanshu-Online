name: Digital Seva Preview Build and Type Check

on:
  pull_request:
    branches: [main, feature/digital-seva-booking-system-2026]
    paths:
      - 'src/features/digital-seva/**'
      - 'functions/api/digital-seva/**'
      - 'migrations/000*.sql'
      - '.github/workflows/digital-seva-ci.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [feature/digital-seva-booking-system-2026]
    paths:
      - 'src/features/digital-seva/**'
      - 'functions/api/digital-seva/**'
      - 'migrations/000*.sql'
      - '.github/workflows/digital-seva-ci.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
