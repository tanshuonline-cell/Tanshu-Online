name: Regenerate Bun Lockfile

on:
  push:
    branches:
      - feature/advanced-passport-photo-studio
    paths:
      - .github/workflows/regenerate-bun-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/advanced-passport-photo-studio
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Regenerate lockfile
        run: bun install
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: regenerate Bun lockfile"
          git push origin HEAD:feature/advanced-passport-photo-studio
