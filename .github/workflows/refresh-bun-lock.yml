name: Refresh Bun Lockfile
on:
  push:
    branches:
      - feature/advanced-passport-photo-studio
    paths:
      - ".github/workflows/refresh-bun-lock.yml"
permissions:
  contents: write
jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/advanced-passport-photo-studio
          persist-credentials: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Regenerate lockfile
        run: bun install
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Update Bun lockfile for BiRefNet browser SDK"
          git push origin HEAD:feature/advanced-passport-photo-studio
