name: Build and Type Check

on:
  pull_request:
    branches: [main, feature/advanced-passport-photo-studio, feature/membership-system-v1-preview, feature/video-49-payment-return-preview]
  push:
    branches: [feature/advanced-passport-photo-studio, feature/photo-signature-resizer, feature/membership-system-v1-preview, feature/video-49-payment-return-preview]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
