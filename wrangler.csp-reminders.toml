name = "tanshu-csp-membership-reminders"
main = "workers/csp-membership-reminders.ts"
compatibility_date = "2026-11-15"

# Separate scheduled Worker so the existing Cloudflare Pages deployment is untouched.
[triggers]
crons = ["30 4 * * *"] # 10:00 AM India Standard Time daily

[vars]
CSP_SENDER_NAME = "TANSHU ONLINE"
CSP_SENDER_EMAIL = "REPLACE_WITH_BREVO_VERIFIED_SENDER_EMAIL"

[[d1_databases]]
binding = "DB"
database_name = "REPLACE_WITH_EXISTING_CSP_D1_DATABASE_NAME"
database_id = "REPLACE_WITH_EXISTING_CSP_D1_DATABASE_ID"
